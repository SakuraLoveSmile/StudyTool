name: Windows Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'desktop/package.json version to build (for example 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish files to the StudyTool-Releases repo (set false for beta/candidate builds)'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark the published GitHub release as a prerelease (beta builds: not listed as latest)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_REPO: SakuraLoveSmile/StudyTool-Releases
  # Feedback widget build configuration (@feedback/web 0.4.0). The frontend only mounts the
  # feedback entry when BOTH of these are non-empty, and they are inlined at build time.
  # The release must never depend on the git-ignored frontend/.env.local.
  # These two values MUST stay identical to the release constants in
  # desktop/scripts/build-release.py, which re-validates and re-injects them.
  VITE_FEEDBACK_API_BASE: "https://feedback.xn--fhqths51enha.cn"
  VITE_FEEDBACK_APP_ID: "studytool"

jobs:
  build-and-publish:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tagVersion = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}' -replace '^desktop-v', ''
          } elseif ('${{ inputs.version }}') {
            $tagVersion = '${{ inputs.version }}'
          } else {
            $tagVersion = $packageVersion
          }
          if ($packageVersion -ne $tagVersion) {
            throw "Version mismatch: desktop/package.json is $packageVersion but requested release is $tagVersion"
          }
          "RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=desktop-v$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate feedback widget configuration
        shell: pwsh
        env:
          FEEDBACK_API_BASE: ${{ env.VITE_FEEDBACK_API_BASE }}
          FEEDBACK_APP_ID: ${{ env.VITE_FEEDBACK_APP_ID }}
        run: |
          # Cheap pre-flight gate: a misconfigured release must fail in seconds, before
          # dependency install and packaging, not silently ship without the feedback entry.
          $expectedApiBase = 'https://feedback.xn--fhqths51enha.cn'
          $expectedAppId = 'studytool'
          if ([string]::IsNullOrWhiteSpace($env:FEEDBACK_API_BASE)) {
            throw 'Missing VITE_FEEDBACK_API_BASE: the release must inject the feedback API base explicitly (frontend/.env.local is git-ignored and never available in CI).'
          }
          if ([string]::IsNullOrWhiteSpace($env:FEEDBACK_APP_ID)) {
            throw 'Missing VITE_FEEDBACK_APP_ID: the release must inject the feedback app id explicitly.'
          }
          if ($env:FEEDBACK_API_BASE -notmatch '^https://[A-Za-z0-9.\-]+$') {
            throw "Invalid VITE_FEEDBACK_API_BASE '$env:FEEDBACK_API_BASE': expected an absolute https:// origin with no path, query, fragment or trailing slash."
          }
          if ($env:FEEDBACK_API_BASE -ne $expectedApiBase) {
            throw "Invalid VITE_FEEDBACK_API_BASE '$env:FEEDBACK_API_BASE': releases must point at $expectedApiBase."
          }
          if ($env:FEEDBACK_APP_ID -ne $expectedAppId) {
            throw "Invalid VITE_FEEDBACK_APP_ID '$env:FEEDBACK_APP_ID': releases must use '$expectedAppId'."
          }
          Write-Host "Feedback widget configuration OK: $env:FEEDBACK_API_BASE (appId=$env:FEEDBACK_APP_ID)"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Install locked Python release dependencies
        run: python -m pip install --upgrade pip; python -m pip install --require-hashes -r backend/requirements.lock

      - name: Install pinned PyInstaller builder
        run: python -m pip install pyinstaller==6.16.0

      - name: Build and validate Windows release
        env:
          # Explicit contract for this step: the frontend production build performed inside
          # build-release.py inherits these and inlines them into the bundle.
          VITE_FEEDBACK_API_BASE: ${{ env.VITE_FEEDBACK_API_BASE }}
          VITE_FEEDBACK_APP_ID: ${{ env.VITE_FEEDBACK_APP_ID }}
        run: python desktop/scripts/build-release.py

      - name: Run Windows installer smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer executable (.exe) not found in desktop/release"
          }
          $evidenceDir = "desktop/release/smoke-evidence"
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          Write-Host "Running Windows installer smoke test on $($installer.FullName)..."
          powershell -ExecutionPolicy Bypass -File desktop/scripts/smoke-windows-installer.ps1 -InstallerPath $installer.FullName -EvidenceDir $evidenceDir -TimeoutSeconds 180

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studytool-smoke-evidence-${{ env.RELEASE_VERSION }}
          if-no-files-found: ignore
          path: desktop/release/smoke-evidence/

      - name: Upload build artifacts to the workflow
        uses: actions/upload-artifact@v4
        with:
          name: studytool-windows-${{ env.RELEASE_VERSION }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml
            desktop/release/RELEASE_MANIFEST.json
            desktop/release/SHA256SUMS.txt

      - name: Verify release publishing credential
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
        shell: pwsh
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_REPO_TOKEN)) {
            throw 'Missing RELEASE_REPO_TOKEN secret with write access to SakuraLoveSmile/StudyTool-Releases'
          }

      - name: Publish release files
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $files = @(Get-ChildItem desktop/release -File | Where-Object {
            $_.Name -match '\.exe$|\.blockmap$|^latest.*\.yml$|^RELEASE_MANIFEST\.json$|^SHA256SUMS\.txt$'
          } | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No release files found' }

          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --repo $env:RELEASE_REPO --clobber
          } else {
            $createArgs = @()
            if ('${{ github.event.inputs.prerelease }}' -eq 'true') {
              # Beta/candidate builds are published as prereleases: visible for
              # anonymous download but never promoted to the "latest" release.
              $createArgs += '--prerelease'
              $createArgs += '--latest=false'
            }
            gh release create $env:RELEASE_TAG @files --repo $env:RELEASE_REPO --title "学习助手 $env:RELEASE_VERSION" --notes "Windows x64 desktop release $env:RELEASE_VERSION" @createArgs
          }
