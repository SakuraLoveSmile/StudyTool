name: Connected clients and server

on:
  workflow_dispatch:
  push:
    branches: ['codex/connected-knowledge-library']
    paths:
      - 'clients/**'
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'compose.yaml'
      - '.dockerignore'
      - '.github/workflows/connected-builds.yml'
  pull_request:
    paths:
      - 'clients/**'
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'compose.yaml'
      - '.dockerignore'
      - '.github/workflows/connected-builds.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable candidate APK
        working-directory: clients/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Hash APK
        run: sha256sum clients/android/app/build/outputs/apk/debug/*.apk > clients/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studytool-connected-android-debug
          if-no-files-found: error
          path: |
            clients/android/app/build/outputs/apk/debug/*.apk
            clients/android/SHA256SUMS.txt

  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/windows/package-lock.json
      - run: npm ci
        working-directory: clients/windows
      - run: npm test
        working-directory: clients/windows
      - run: npm run pack
        working-directory: clients/windows
      - name: Install and launch candidate
        shell: pwsh
        working-directory: clients/windows
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not built' }
          powershell -ExecutionPolicy Bypass -File scripts/smoke-installer.ps1 -InstallerPath $installer.FullName -EvidenceDir release/smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studytool-connected-windows-smoke
          if-no-files-found: ignore
          path: clients/windows/release/smoke/
      - name: Hash installer
        shell: pwsh
        run: |
          Get-ChildItem clients/windows/release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content clients/windows/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studytool-connected-windows-x64
          if-no-files-found: error
          path: |
            clients/windows/release/*.exe
            clients/windows/release/SHA256SUMS.txt

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Build and export Linux x64 images
        run: python deploy/build_bundle.py --platform linux/amd64 --tag connected-${{ github.sha }}
      - name: Verify isolated server
        run: python deploy/smoke_images.py --bundle artifacts/connected-delivery/server
      - uses: actions/upload-artifact@v4
        with:
          name: studytool-connected-server-linux-amd64
          if-no-files-found: error
          include-hidden-files: true
          path: artifacts/connected-delivery/server/
